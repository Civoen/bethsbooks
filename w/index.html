<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beth's wishlist</title>
<meta name="description" content="Books Beth would love to read.">
<meta property="og:title" content="Beth's book wishlist">
<meta property="og:description" content="Books Beth would love to read — perfect for gift ideas.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBEFF2">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/png" href="../icons/favicon-64.png">
<link rel="stylesheet" href="../css/app.css">
<style>
  .wish{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 32px);display:flex;flex-direction:column;gap:20px}
  .wish .brand{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;font-weight:600;text-decoration:none}
  .wish .brand img{width:28px;height:28px;border-radius:8px}
  .wish h1{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.1;text-wrap:balance}
  .wish .lede{margin:6px 0 0;color:var(--muted)}
  .wish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px}
  .wish-item{display:flex;flex-direction:column;gap:8px;min-width:0}
  .wish-item .cover{width:100%;height:auto;aspect-ratio:2/3;max-width:100%}
  .wish-item .cover .ct{font-size:16px}
  .wish-item .t{font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.2;word-break:break-word}
  .wish-item .a{font-size:13px;color:var(--muted)}
  .wish-item .find{font-size:13px;font-weight:600;color:var(--primary);text-decoration:none;align-self:flex-start;padding:6px 0}
  .wish-item .find:hover{text-decoration:underline}
  .wish .foot{text-align:center;color:var(--muted);font-size:13px}
  @media (max-width:420px){.wish-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main class="wish">
  <a class="brand" href="../"><img src="../icons/icon-192.png" alt="">Beth's Books</a>
  <header><h1 id="w-title">A book wishlist</h1><p class="lede" id="w-lede">Opening…</p></header>
  <div class="wish-grid" id="w-grid"></div>
  <p class="foot">A snapshot from Beth's personal reading library. “Find it” searches Bookshop.org, which supports independent bookshops.</p>
</main>
<noscript><p style="padding:24px">This page needs JavaScript turned on to show the list.</p></noscript>
<script type="module" src="./w.js"></script>
</body>
</html>
